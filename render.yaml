services:
  - type: web
    name: finance-backend
    env: node
    buildCommand: npm install && npm run build && npx prisma db push && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
